{% extends 'base.html' %}
{% block content %}
<h1>Wybierz usługę</h1>
{% if request.user.is_staff %}
  <p style="float:right; margin-top:-40px;">
    <a href="/admin/ideas/service/add/" title="Dodaj usługę">
      <!-- small plus icon -->
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="11" stroke="#2b7a78" stroke-width="1" fill="#2b7a78" opacity="0.08"/>
        <path d="M12 7v10M7 12h10" stroke="#2b7a78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
  </p>
{% endif %}
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Dalej</button>
</form>
{% endblock %}
