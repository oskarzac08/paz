<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <title>{% block title %}Moja aplikacja{% endblock %}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        nav {
            background-color: #35424a;
            color: #ffffff;
            padding: 10px 0;
            text-align: center;
        }
        nav a {
            color: #ffffff;
            margin: 0 15px;
            text-decoration: none;
        }
        main {
            padding: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        table, th, td {
            border: 1px solid #dddddd;
        }
        th, td {
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        .idea-images {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }
        .idea-image {
            flex: 1 1 200px; /* grow, shrink, base width */
            max-width: 100%;
            height: auto;
        }
        .idea-image-figure {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            max-width: 240px;
        }
        .idea-image-meta {
            margin-top: 4px;
            color: #666;
            font-size: 0.85em;
        }
    </style>
  </head>
  <body>
        <nav>
            <a href="/">Strona główna</a> | <a href="/admin/">Admin</a>
            {% if user.is_authenticated %}
                | <form method="post" action="{% url 'logout' %}" style="display:inline">
                    {% csrf_token %}
                    <button type="submit" style="background:none;border:none;color:#ffffff;cursor:pointer;padding:0;margin:0;text-decoration:underline;">Wyloguj</button>
                  </form>
            {% else %}
                | <a href="{% url 'login' %}">Zaloguj</a>
            {% endif %}
        </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
  </body>
</html>
