{% extends 'base.html' %}

{% block content %}
<h2>Logowanie</h2>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    {% if next %}
        <input type="hidden" name="next" value="{{ next }}">
    {% else %}
        <input type="hidden" name="next" value="/">
    {% endif %}
    <button type="submit">Zaloguj</button>
    <p><a href="/admin/">Panel admina</a></p>
</form>

<div style="margin-top:20px;">
    <p>Jeśli nie masz konta, utwórz je</p>
    <a href="{% url 'ideas:register' %}" style="display:inline-block;margin:8px;padding:10px 16px;background:#28a745;color:#fff;text-decoration:none;border-radius:4px;">Zarejestruj się</a>
</div>

{% endblock %}
